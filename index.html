<!DOCTYPE html>
<html>
<head>
    <title>My Gaming Website</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #111;
            color: white;
            text-align: center;
        }

        header {
            background: #222;
            padding: 25px;
        }

        h1 {
            color: #00ff88;
        }

        .games {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 40px 20px;
        }

        .game {
            background: #222;
            padding: 25px;
            width: 180px;
            border-radius: 15px;
        }

        button {
            background: #00ff88;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
        }
    </style>
</head>

<body>

<header>
    <h1>🎮 My Gaming Website</h1>
    <p>Welcome to my gaming world!</p>
</header>

<h2>🔥 My Favourite Games</h2>

<div class="games">
    <div class="game">
        <h3>🔥 Free Fire</h3>
        <p>Battle Royale</p>
    </div>

    <div class="game">
        <h3>⛏️ Minecraft</h3>
        <p>Build & Explore</p>
    </div>

    <div class="game">
        <h3>🚗 GTA V</h3>
        <p>Open World</p>
    </div>
</div>

<button onclick="alert('Welcome Gamer! 🎮')">
    Click Me
</button>

</body>
</html>
